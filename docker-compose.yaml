version: "3.8"

services:
  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
  s3-gateway:
    image: ghcr.io/nginxinc/nginx-s3-gateway/nginx-oss-s3-gateway:latest
    container_name: s3-gateway
    depends_on:
      - localstack
    # Accès direct temporaire pour tester (à supprimer à la fin) :
    ports:
      - "127.0.0.1:8080:80"
    environment:
      S3_BUCKET_NAME: ${BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_SERVER: localstack
      S3_SERVER_PORT: 4566
      S3_SERVER_PROTO: http
      S3_REGION: ${AWS_REGION}
      S3_STYLE: path
      AWS_SIGS_VERSION: 4
      ALLOW_DIRECTORY_LIST: "false"
      PROVIDE_INDEX_PAGE: "true"

  nginx-front:
    image: nginx:stable
    container_name: nginx-front
    depends_on:
      - s3-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./nginx/certs:/etc/nginx/certs:ro"  